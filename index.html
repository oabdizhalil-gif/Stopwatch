<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compass Plus Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="logoBtn" class="logo" type="button" title="Home">
        <span class="logo-mark"></span>
        <span class="logo-text">Compass <strong>PLUS</strong></span>
      </button>
      <button id="menuBtn" class="menu-btn" type="button" title="Admin">☰</button>
    </header>

    <main id="app" class="page"></main>
  </div>

  <div id="wordPopup" class="word-popup hidden" role="dialog" aria-live="polite"></div>

  <template id="scrollRailTemplate">
    <aside class="scroll-rail" aria-hidden="true">
      <button class="scroll-arrow" data-dir="up">⌃</button>
      <div class="scroll-line"></div>
      <button class="scroll-arrow" data-dir="down">⌄</button>
    </aside>
  </template>

  <script src="index.js"></script>
</body>
</html>
